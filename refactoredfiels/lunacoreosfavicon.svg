<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Core Glow & Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </radialGradient>

    <!-- Crescent Glow -->
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Shape -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Orbit Segment -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Luna Crescent -->
  <path d="M32 14 A 18 18 0 1 0 50 32 A 13.5 13.5 0 1 1 32 14 Z" 
        fill="url(#crescentGrad)" 
        filter="url(#glow)" />

  <!-- Central "Core" Node -->
  <circle cx="32" cy="32" r="5.5" fill="url(#coreGlow)" />
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
  
  <!-- Tiny OS Satellite Nodes -->
  <circle cx="45" cy="20" r="1.5" fill="#38bdf8" opacity="0.8" />
</svg>
